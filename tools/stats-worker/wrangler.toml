name = "elysee2027-stats"
main = "worker.js"
compatibility_date = "2026-01-01"

# Aucun journal d'application : rien ne doit permettre de relier une requête à une personne.
[observability]
enabled = false

[vars]
# Origine(s) autorisée(s), séparées par des virgules : l'adresse de votre site, sans chemin.
ALLOWED_ORIGIN = "https://VOTRE-SITE.example"

[[d1_databases]]
binding = "DB"
database_name = "elysee2027-stats"
database_id = "À REMPLIR APRÈS « wrangler d1 create elysee2027-stats »"
